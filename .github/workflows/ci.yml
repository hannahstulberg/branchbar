name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  xcode:
    name: Test + package (full Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: swift --version && xcode-select -p
      - run: make test
      - run: make zip BUILD_NUMBER=${{ github.run_number }}
      - run: make verify
      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: BranchBar-mac
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  clt:
    name: Test + build (Command Line Tools only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - run: swift --version && xcode-select -p
      - run: make test
      - run: make build

  release:
    needs: [xcode, clt]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: BranchBar-mac, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          body: |
            Unsigned build. First-open steps are in the README "Install" section
            (System Settings > Privacy & Security > Open Anyway).
